name: Validate HanJoo IR main

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-smoke-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate metadata versions
        shell: bash
        run: |
          set -euo pipefail
          cfg_ver="$(sed -n 's/^version: "\([^"]*\)"/\1/p' hanjoo_ir_core/config.yaml | head -n1)"
          run_ver="$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' hanjoo_ir_core/run.sh | head -n1)"
          docker_ver="$(sed -n 's/^[[:space:]]*HANJOO_VERSION=\([^[:space:]]*\)/\1/p' hanjoo_ir_core/Dockerfile | head -n1)"
          test -n "$cfg_ver"
          test "$cfg_ver" = "$run_ver"
          test "$cfg_ver" = "$docker_ver"
          echo "Validated HanJoo version $cfg_ver"

      - name: Syntax check shell and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          sh -n hanjoo_ir_core/run.sh
          node --check hanjoo_ir_core/probe_server.cjs
          node --check hanjoo_ir_core/core_runtime.protected.cjs

      - name: Build add-on image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t hanjoo-ir:test hanjoo_ir_core

      - name: Start image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hanjoo-config/custom_components
          printf '# CI bootstrap\n' >/tmp/hanjoo-config/configuration.yaml
          docker rm -f hanjoo-ir-test >/dev/null 2>&1 || true
          docker run -d --name hanjoo-ir-test \
            -v /tmp/hanjoo-config:/config \
            -p 18099:8099 -p 18101:8101 -p 18102:8102 \
            hanjoo-ir:test

      - name: Wait for all services
        shell: bash
        run: |
          set -euo pipefail
          for port in 18099 18101 18102; do
            ok=0
            for i in $(seq 1 60); do
              if ! docker inspect hanjoo-ir-test >/dev/null 2>&1; then
                echo "Container disappeared while waiting for port $port"
                break
              fi
              running="$(docker inspect -f '{{.State.Running}}' hanjoo-ir-test 2>/dev/null || echo false)"
              if [ "$running" != "true" ]; then
                echo "Container stopped while waiting for port $port"
                docker logs hanjoo-ir-test || true
                break
              fi
              if curl -fsS "http://127.0.0.1:${port}/health" | grep -q '"ok":true'; then ok=1; break; fi
              sleep 1
            done
            if [ "$ok" != 1 ]; then
              echo "Service on port $port failed health check"
              docker logs hanjoo-ir-test || true
              exit 1
            fi
          done

      - name: Verify native AC bridge flags
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS http://127.0.0.1:18101/health)"
          echo "$health"
          echo "$health" | grep -q '"native_brain_bridge":true'
          echo "$health" | grep -q '"tasmota_style_ac":true'
          echo "$health" | grep -q '"hvac_state_bridge":true'

      - name: Verify Manager auto-install/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/hanjoo-config/custom_components/hanjoo_ir/manifest.json
          grep -q '^hanjoo_ir:' /tmp/hanjoo-config/configuration.yaml

      - name: Show logs
        if: always()
        run: docker logs hanjoo-ir-test || true

      - name: Cleanup test container
        if: always()
        run: docker rm -f hanjoo-ir-test >/dev/null 2>&1 || true
