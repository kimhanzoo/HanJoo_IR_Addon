name: Validate HanJoo IR main

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-smoke-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate metadata versions
        shell: bash
        run: |
          set -euo pipefail
          cfg_ver="$(sed -n 's/^version: "\([^"]*\)"/\1/p' hanjoo_ir_core/config.yaml | head -n1)"
          run_ver="$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' hanjoo_ir_core/run.sh | head -n1)"
          docker_ver="$(sed -n 's/^[[:space:]]*HANJOO_VERSION=\([^[:space:]]*\)/\1/p' hanjoo_ir_core/Dockerfile | head -n1)"
          manifest_ver="$(python3 -c 'import json; print(json.load(open("hanjoo_ir_core/integration/hanjoo_ir/manifest.json"))["version"])')"
          const_ver="$(python3 -c 'import re; s=open("hanjoo_ir_core/integration/hanjoo_ir/const.py").read(); print(re.search(r"^VERSION = \"([^\"]+)\"", s, re.M).group(1))')"
          test -n "$cfg_ver"
          test "$cfg_ver" = "$run_ver"
          test "$cfg_ver" = "$docker_ver"
          test "$cfg_ver" = "$manifest_ver"
          test "$cfg_ver" = "$const_ver"
          echo "Validated HanJoo version $cfg_ver"

      - name: Syntax check shell, JavaScript and Manager Python
        shell: bash
        run: |
          set -euo pipefail
          sh -n hanjoo_ir_core/run.sh
          node --check hanjoo_ir_core/probe_server.cjs
          node --check hanjoo_ir_core/core_runtime.protected.cjs
          node --check hanjoo_ir_core/integration/hanjoo_ir/frontend/hanjoo-ir-panel-v065.js
          python3 -m compileall -q hanjoo_ir_core/integration/hanjoo_ir

      - name: Build add-on image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t hanjoo-ir:test hanjoo_ir_core

      - name: Start image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hanjoo-config/custom_components
          printf '# CI bootstrap\n' >/tmp/hanjoo-config/configuration.yaml
          docker rm -f hanjoo-ir-test >/dev/null 2>&1 || true
          docker run -d --name hanjoo-ir-test \
            -v /tmp/hanjoo-config:/config \
            -p 18099:8099 -p 18101:8101 -p 18102:8102 \
            hanjoo-ir:test

      - name: Wait for all services
        shell: bash
        run: |
          set -euo pipefail
          for port in 18099 18101 18102; do
            ok=0
            for i in $(seq 1 60); do
              if ! docker inspect hanjoo-ir-test >/dev/null 2>&1; then
                echo "Container disappeared while waiting for port $port"
                break
              fi
              running="$(docker inspect -f '{{.State.Running}}' hanjoo-ir-test 2>/dev/null || echo false)"
              if [ "$running" != "true" ]; then
                echo "Container stopped while waiting for port $port"
                docker logs hanjoo-ir-test || true
                break
              fi
              if curl -fsS "http://127.0.0.1:${port}/health" | grep -q '"ok":true'; then ok=1; break; fi
              sleep 1
            done
            if [ "$ok" != 1 ]; then
              echo "Service on port $port failed health check"
              docker logs hanjoo-ir-test || true
              exit 1
            fi
          done

      - name: Verify native AC bridge flags
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS http://127.0.0.1:18101/health)"
          echo "$health"
          echo "$health" | grep -q '"native_brain_bridge":true'
          echo "$health" | grep -q '"tasmota_style_ac":true'
          echo "$health" | grep -q '"hvac_state_bridge":true'
          echo "$health" | grep -q '"resource_guard":true'
          echo "$health" | grep -q '"signed_input":true'
          echo "$health" | grep -q '"native_short_circuit":true'

      - name: Verify repeated NEC vendor fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/lg-nec.json
          import json
          raw = """8999 -4437 563 -563 593 -500 563 -1687 532 -531 605 -489 593 -532 562 -531 688 -437 656 -1594 532 -1625 593 -500 563 -1718 500 -1657 593 -1637 551 -1656 594 -1625 594 -500 593 -500 594 -531 657 -1605 520 -531 604 -490 716 -424 644 -434 656 -1594 531 -1625 594 -1625 594 -500 594 -1625 594 -1625 594 -1625 562 -1625 594 -40594 9032 -4437 594 -500 563 -562 657 -1593 532 -531 562 -532 656 -437 698 -427 657 -437 656 -1594 563 -1593 563 -563 593 -1656 532 -1625 594 -1625 572 -1647 562 -1626 562 -563 594 -512 682 -421 622 -1674 508 -511 640 -471 595 -489 625 -501 593 -1656 500 -1656 562 -1656 563 -531 625 -1625 532 -1656 531 -1656 563 -1656 562 -50000"""
          print(json.dumps({"timings":[int(x) for x in raw.split()]}))
          PY
          curl --max-time 20 -fsS -H 'content-type: application/json'             --data-binary @/tmp/lg-nec.json http://127.0.0.1:18101/v1/probe-all >/tmp/lg-nec-result.json
          cat /tmp/lg-nec-result.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/lg-nec-result.json"))
          rows=(p.get("irremoteesp8266") or {}).get("candidates") or []
          assert rows, p
          best=rows[0]
          assert str(best.get("protocol","")).upper() == "NEC", best
          assert best.get("brand") == "LG", best
          assert best.get("brand_evidence") == "nec_vendor_prefix_20DF", best
          PY

      - name: Stress long AC probe and verify services survive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/long-ac.json
          import json
          # Include a leading idle-space to verify signed mark/space handling.
          t=[-50000]
          for section in range(4):
              t += [3500,-1750]
              for i in range(70):
                  t += [430, -1290 if (i + section) % 3 == 0 else -430]
              if section < 3:
                  t += [430,-28000]
          t += [430,-50000]
          print(json.dumps({"timings": t}))
          PY
          for i in 1 2 3; do
            echo "Long AC probe $i"
            curl --max-time 30 -fsS -H 'content-type: application/json' \
              --data-binary @/tmp/long-ac.json http://127.0.0.1:18101/v1/probe-all >/tmp/probe-$i.json
            grep -q '"recognition_coverage":128' /tmp/probe-$i.json
            python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); n=int(p.get("variants_tested",99)); assert n <= 4, n' /tmp/probe-$i.json
            test "$(docker inspect -f '{{.State.Running}}' hanjoo-ir-test)" = "true"
            curl -fsS http://127.0.0.1:18101/health | grep -q '"ok":true'
            curl -fsS http://127.0.0.1:18102/health | grep -q '"ok":true'
          done

      - name: Verify Manager auto-install/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/hanjoo-config/custom_components/hanjoo_ir/manifest.json
          grep -q '^hanjoo_ir:' /tmp/hanjoo-config/configuration.yaml

      - name: Show logs
        if: always()
        run: docker logs hanjoo-ir-test || true

      - name: Cleanup test container
        if: always()
        run: docker rm -f hanjoo-ir-test >/dev/null 2>&1 || true
